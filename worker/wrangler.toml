name = "statscalc"

compatibility_date = "2022-04-05"

keep_vars = true

[durable_objects]
bindings = [
  { name = "MAILBOX", class_name = "NotificationMailbox" },
  { name = "REMINDERS", class_name = "ClubReminders" },
  { name = "FANOUT", class_name = "NotificationFanout" }
]

[[migrations]]
tag = "v1-mailbox-sqlite"
new_sqlite_classes = ["NotificationMailbox"]

[[migrations]]
tag = "v2-reminders-sqlite"
new_sqlite_classes = ["ClubReminders"]

[[migrations]]
tag = "v3-fanout-sqlite"
new_sqlite_classes = ["NotificationFanout"]

[observability.logs]
enabled = true