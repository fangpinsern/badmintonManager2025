name = "statscalc"

compatibility_date = "2022-04-05"

keep_vars = true

[durable_objects]
bindings = [
  { name = "MAILBOX", class_name = "NotificationMailbox" }
]

[[migrations]]
tag = "v1-mailbox-sqlite"
new_sqlite_classes = ["NotificationMailbox"]

[observability.logs]
enabled = true

[vars]
# Optional public variable for app to know bot username (exposed separately in app env)
TELEGRAM_BOT_USERNAME = ""