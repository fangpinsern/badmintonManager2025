name: Build and Generate Changelog

on:
  push:
    branches:
      - main
      - "feature/**"
      - "remote"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 200 # ensure enough history for changelog

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Generate build info and changelog
        run: |
          node scripts/write-build-info.js
          CHANGELOG_LIMIT=400 node scripts/write-changelog.js
        working-directory: .

